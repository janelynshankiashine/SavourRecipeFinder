<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | SAVOUR</title><link rel="stylesheet" href="css/styles.css"><script src="js/theme.js" defer></script><script src="js/validation.js" defer></script></head>
<body><header class="site-header"><nav class="navbar"><a class="logo" href="index.html">SAVOUR<span>.</span></a><div class="nav-links"><a href="index.html">Home</a><a href="home.html">Recipes</a><a href="signin.html">Sign in</a><button class="theme-btn" data-theme-toggle>☾ Theme</button></div></nav></header>
<main class="form-page"><form class="form-card" id="registrationForm" novalidate><p class="eyebrow">JOIN OUR COMMUNITY</p><h1>Create your profile</h1><p class="muted">Fill in your details to register with SAVOUR.</p>
<div class="form-grid">
<label>Full Name<input id="fullName" type="text" placeholder="Your full name"><span class="error-msg"></span></label>
<label>Employee / Register ID<input id="empId" type="text" placeholder="e.g. 26CSE123"><span class="error-msg"></span></label>
<label>Email Address<input id="regEmail" type="email" placeholder="name@example.com"><span class="error-msg"></span></label>
<label>Mobile Number<input id="mobile" type="tel" placeholder="10-digit mobile number"><span class="error-msg"></span></label>
<label>Division<select id="dept"><option value="">Select division</option><option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option><option>Other</option></select><span class="error-msg"></span></label>
<label>Password<input id="regPassword" type="password" placeholder="Create a strong password"><span class="error-msg"></span></label>
<label class="full-width">Confirm Password<input id="confirmPassword" type="password" placeholder="Re-enter password"><span class="error-msg"></span></label>
</div><button class="btn full-width" id="registerSubmit" type="submit" disabled>Register</button><p class="form-foot">Already registered? <a href="signin.html">Sign in</a></p><p class="small-note">Demo project: registration data is stored only in this browser using localStorage.</p></form></main><script src="js/chatbot.js" defer></script></body></html>
